services:
  adguard-home:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    restart: unless-stopped
    ports:
      # DNS: preso ao IP da LAN (não 0.0.0.0) pra não colidir com o
      # systemd-resolved, que já escuta em 127.0.0.53:53 neste host.
      - "192.168.0.59:53:53/tcp"
      - "192.168.0.59:53:53/udp"
      # Admin UI / setup wizard
      - "3000:3000/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
